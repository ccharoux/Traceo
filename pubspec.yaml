name: trackeo
description: Trackeo - Gardez une trace inoubliable de vos randonnées, trajets et vols en ULM. Navigation avec cap, cartographie OACI et gestion des cartes VAC pour les pilotes.
version: 1.1.9+29

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  file_picker: ^8.0.5
  share_plus: ^7.2.2
  provider: ^6.1.2
  intl: ^0.20.2
  google_maps_flutter: ^2.7.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  path: ^1.9.0
  url_launcher: ^6.3.0
  archive: ^3.4.9
  http: ^1.2.1
  open_filex: ^4.7.0
  in_app_purchase: ^3.2.0
  package_info_plus: ^8.0.0
  image_picker: ^1.1.2 # Ajouté pour la capture de photos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  logging: ^1.2.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
   
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Promenade.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/Promenade.png"
  adaptive_icon_foreground_inset: 0
